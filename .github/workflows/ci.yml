name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform -chdir=terraform/aws-infra fmt -check -recursive

      - name: Initialize without backend
        run: terraform -chdir=terraform/aws-infra init -backend=false -input=false

      - name: Validate
        run: terraform -chdir=terraform/aws-infra validate -no-color
